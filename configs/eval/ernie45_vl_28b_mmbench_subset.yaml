# Eval ernie-4.5-vl-28b-a3b on shijianS01/mmbench-subset (100 samples). vLLM chat-API wrapper
# (unifiedmlm/models/vllm_chat.py)，需要新 vLLM（A800 .venv-vllm）。 MoE 28B-A3B，权重 ~56G，80G 单卡
model:
  name: ernie-4.5-vl-28b-a3b
  config:
    model_path: baidu/ERNIE-4.5-VL-28B-A3B-PT
    tensor_parallel: 1
    max_model_len: 8192
    gpu_memory_util: 0.9
    sampling:
      temperature: 0.0
      max_tokens: 128

benchmark:
  name: mmbench
  config:
    hf_path: shijianS01/mmbench-subset
    hf_name: default
    split: eval

extractor:
  sim_threshold: 0.5
  sentence_model: sentence-transformers/all-MiniLM-L6-v2

batch_size: 16
output_dir: outputs/ernie45_vl_28b_mmbench_subset
