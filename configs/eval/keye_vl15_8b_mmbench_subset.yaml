# Eval keye-vl-1.5-8b on shijianS01/mmbench-subset (100 samples). vLLM chat-API wrapper
# (unifiedmlm/models/vllm_chat.py)，需要新 vLLM（A800 .venv-vllm）。 auto-thinking，wrapper strip 兜底
model:
  name: keye-vl-1.5-8b
  config:
    model_path: Kwai-Keye/Keye-VL-1.5-8B
    tensor_parallel: 1
    max_model_len: 8192
    gpu_memory_util: 0.9
    sampling:
      temperature: 0.0
      max_tokens: 2048

benchmark:
  name: mmbench
  config:
    hf_path: shijianS01/mmbench-subset
    hf_name: default
    split: eval

extractor:
  sim_threshold: 0.5
  sentence_model: sentence-transformers/all-MiniLM-L6-v2

batch_size: 16
output_dir: outputs/keye_vl15_8b_mmbench_subset
